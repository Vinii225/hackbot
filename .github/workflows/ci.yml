name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The harness is stdlib-only: no install step, no third-party dependencies.
      - name: Byte-compile the whole tree (syntax gate)
        run: python -m compileall -q orchestrator tools tests
      - name: Run test suite (deprecation warnings are errors)
        run: python -W error::DeprecationWarning -m unittest discover -s tests -v
